name: CI

on:
  push:
  pull_request:

jobs:
  engine:
    name: YCodeEngine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S YCodeEngine -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  # agent.exe 依赖 vcpkg 提供的 libcurl；Qt 客户端依赖 Qt6，暂未纳入 CI。
  agent:
    name: Agent (Windows)
    runs-on: windows-latest
    env:
      # 运行器上 VCPKG_ROOT 默认指向 VS 自带的 vcpkg，显式指向独立的 C:\vcpkg，
      # 与 `vcpkg install` 的安装目录保持一致，build.bat 才能找到头文件/库。
      VCPKG_ROOT: C:\vcpkg
      VCPKG_TRIPLET: x64-windows
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1

      - name: Install curl via vcpkg
        shell: bash
        run: vcpkg install curl:x64-windows

      - name: Build agent.exe
        shell: cmd
        run: |
          set YCODE_NONINTERACTIVE=1
          build.bat

      - name: Compile agent logic tests
        shell: cmd
        run: cl /nologo /EHsc /utf-8 tests\agent_logic_tests.cpp /I YCodeEngine\third_party /I C:\vcpkg\installed\x64-windows\include /link /LIBPATH:C:\vcpkg\installed\x64-windows\lib libcurl.lib shell32.lib /OUT:agent_tests.exe

      - name: Run agent logic tests
        shell: cmd
        run: agent_tests.exe
